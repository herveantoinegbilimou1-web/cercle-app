<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14110c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cercle des Africains">
<title>Cercle des Africains</title>
<meta name="description" content="Organisation culturelle panafricaine en Fédération de Russie">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Manrope:wght@400;500;600;700&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
<style>
:root{
  /* Charte du Cercle : fond sombre, or, bandes kente. App mobile à onglets en bas. */
  --bg:#14110c;
  --surface:#1f1a12;
  --line:#3a3122;
  --gold:#d9a521;
  --gold-soft:#f0cf74;
  --text:#f4ecdc;
  --muted:#b5a888;
  --kente-g:#1f7a4a;
  --kente-r:#b5321f;
  --display:"Syne", "Arial Black", system-ui, sans-serif;
  --body:"Manrope", "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--gold-soft)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold-soft);outline-offset:3px;border-radius:6px}
.app{display:flex;flex-direction:column;min-height:100%;max-width:560px;margin:0 auto;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.kente{height:10px;background:repeating-linear-gradient(90deg,var(--gold) 0 18px,var(--bg) 18px 22px,var(--kente-g) 22px 34px,var(--bg) 34px 38px,var(--kente-r) 38px 50px,var(--bg) 50px 54px)}
header.top{padding:calc(16px + env(safe-area-inset-top)) 20px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:52px;height:52px;flex:none;border-radius:50%;background:#fff}
.brand-name{font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.06em;line-height:1.15;text-transform:uppercase}
.brand-name span{display:block;color:var(--gold)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.lang button{background:none;border:0;color:var(--muted);font-weight:600;font-size:12.5px;padding:7px 10px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--gold);color:var(--bg)}
main{flex:1;padding:4px 20px 24px}
section.view{display:none;flex-direction:column;gap:18px}
section.view.on{display:flex}
h1{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.08;text-wrap:balance}
h1 em{font-style:normal;color:var(--gold)}
h2{font-family:var(--display);font-weight:700;font-size:21px;line-height:1.2;text-wrap:balance;margin-top:6px}
h3{font-size:16px;font-weight:700;line-height:1.3}
p.lead{color:var(--muted);font-size:16px;max-width:62ch}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.hero{display:flex;flex-direction:column;gap:14px;padding:10px 0 2px}
.hero-logo{width:min(200px,54vw);height:auto;border-radius:50%;background:#fff;box-shadow:0 0 0 4px var(--gold);align-self:center;margin:6px 0 4px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fact{border-top:2px solid var(--gold);padding-top:10px}
.fact b{display:block;font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.fact small{color:var(--muted);font-size:12.5px;line-height:1.3;display:block}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--gold);color:var(--bg);font-weight:700;text-decoration:none;border-radius:14px;padding:15px 18px;font-size:16px;border:0;cursor:pointer;width:100%}
.cta.ghost{background:none;color:var(--gold-soft);border:1px solid var(--line)}
.cta.small{padding:10px 14px;font-size:14px;width:auto;align-self:flex-start;border-radius:10px;margin-top:10px}
.feature{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.spot{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--text);min-width:0}
.spot .k{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.spot .flag,.fete .flag{font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif}
.spot .flag{font-size:30px;line-height:1}
.spot b{font-size:15px;line-height:1.25;overflow-wrap:anywhere}
.spot small{color:var(--muted);font-size:13px;line-height:1.35}
.spot .count{font-family:var(--display);font-weight:700;color:var(--gold-soft);font-size:14px}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;gap:14px;align-items:flex-start}
.item.today{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.item .date{flex:none;width:58px;text-align:center;border-right:1px solid var(--line);padding-right:12px}
.item .date b{display:block;font-family:var(--display);font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
.item .date small{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.item p{color:var(--muted);font-size:14.5px;margin-top:4px}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--gold-soft);margin-top:6px}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:2px}
.pill{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.04em;padding:3px 9px;border-radius:999px;margin-top:8px}
.pill.past{background:#2b261c;color:var(--muted)}
.pill.ok{background:rgba(31,122,74,.22);color:#7fd3a6}
.pill.wip{background:rgba(217,165,33,.18);color:var(--gold-soft)}
.empty{border:1px dashed var(--line);border-radius:14px;padding:18px;color:var(--muted);font-size:14.5px}
.swatch{width:10px;align-self:stretch;border-radius:4px;flex:none}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{background:none;border:0;border-radius:9px;padding:10px 8px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--bg)}
.fete .flag{flex:none;width:58px;text-align:center;font-size:34px;line-height:1.1;border-right:1px solid var(--line);padding-right:12px}
.fete .flag small{display:block;font-size:12px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.month{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:10px 0 -2px}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gallery button{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;padding:0;cursor:pointer;text-align:left;display:flex;flex-direction:column}
.gallery img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#2b261c}
.gallery span{font-size:12.5px;color:var(--muted);padding:8px 10px;line-height:1.3}
.lightbox{position:fixed;inset:0;background:rgba(10,8,5,.96);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;z-index:20}
.lightbox.on{display:flex}
.lightbox img{max-width:100%;max-height:78vh;border-radius:10px}
.lightbox p{color:var(--text);text-align:center;max-width:46ch}
.lightbox button{position:absolute;top:calc(14px + env(safe-area-inset-top));right:16px;background:var(--surface);border:1px solid var(--line);border-radius:999px;width:42px;height:42px;font-size:20px;cursor:pointer}
.pillars{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pillar{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:4px}
.pillar b{font-family:var(--display);font-size:16px}
.pillar span{color:var(--muted);font-size:13.5px;line-height:1.4}
.pillar:nth-child(2){border-top-color:var(--kente-r)}.pillar:nth-child(3){border-top-color:var(--kente-g)}.pillar:nth-child(4){border-top-color:var(--gold-soft)}
.contacts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.contact{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-decoration:none;color:var(--text);display:flex;flex-direction:column;gap:2px;min-width:0}
.contact b{font-size:13px;color:var(--gold)}
.contact span{font-size:14px;overflow-wrap:anywhere}
.share{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;gap:16px;align-items:center}
.share img{width:128px;height:128px;border-radius:10px;background:#fff;flex:none}
.share p{color:var(--muted);font-size:14px}
.copied{font-size:13px;color:#7fd3a6;min-height:1.2em;margin-top:6px}
.steps{counter-reset:s;display:flex;flex-direction:column;gap:10px;list-style:none}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;color:var(--muted);font-size:14.5px}
.steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--surface);border:1px solid var(--gold);color:var(--gold);font-weight:700;font-size:13px;display:grid;place-items:center}
.note{font-size:13px;color:var(--muted)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(20,17,12,.96);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(8px);z-index:10}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:var(--muted);font-size:11.5px;font-weight:600;padding:6px 2px;border-radius:10px;text-align:center}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a[aria-current="page"]{color:var(--gold)}
@media (prefers-reduced-motion:no-preference){section.view.on{animation:in .25s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
@media (max-width:380px){h1{font-size:26px}.fact b{font-size:18px}}
@media (max-width:360px){.pillars,.contacts,.feature{grid-template-columns:1fr}.share{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<div class="app">
  <div class="kente" aria-hidden="true"></div>
  <header class="top">
    <div class="brand">
      <img class="mark" src="logo.png" alt="Logo du Cercle des Africains" width="52" height="52">
      <div class="brand-name">Cercle des<span>Africains</span></div>
    </div>
    <div class="lang" role="group" aria-label="Langue / Язык / Language">
      <button type="button" id="lang-fr" data-lang="fr" aria-pressed="true">FR</button>
      <button type="button" id="lang-ru" data-lang="ru" aria-pressed="false">RU</button>
      <button type="button" id="lang-en" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>

  <main>
    <!-- ACCUEIL -->
    <section class="view" id="v-accueil" data-view="accueil">
      <div class="hero">
        <img class="hero-logo" src="logo.png" alt="Cercle des Africains — Unité, Culture, Engagement" width="200" height="200">
        <div class="eyebrow" data-i18n="home_eyebrow"></div>
        <h1 data-i18n-html="home_title"></h1>
        <p class="lead" data-i18n="home_lead"></p>
      </div>
      <div class="feature">
        <a class="spot" href="#agenda" id="spot-event"></a>
        <a class="spot" href="#fetes" id="spot-fete"></a>
      </div>
      <div class="facts">
        <div class="fact"><b>300+</b><small data-i18n="fact_jca"></small></div>
        <div class="fact"><b>54</b><small data-i18n="fact_countries"></small></div>
        <div class="fact"><b>2026</b><small data-i18n="fact_can"></small></div>
      </div>
      <a class="cta" href="#adherer" data-i18n="cta_join"></a>
      <h2 data-i18n="pillars_title"></h2>
      <div class="pillars">
        <div class="pillar"><b data-i18n="p1_t"></b><span data-i18n="p1_d"></span></div>
        <div class="pillar"><b data-i18n="p2_t"></b><span data-i18n="p2_d"></span></div>
        <div class="pillar"><b data-i18n="p3_t"></b><span data-i18n="p3_d"></span></div>
        <div class="pillar"><b data-i18n="p4_t"></b><span data-i18n="p4_d"></span></div>
      </div>
    </section>

    <!-- AGENDA : événements + fêtes nationales -->
    <section class="view" id="v-agenda" data-view="agenda">
      <div class="eyebrow" data-i18n="agenda_eyebrow"></div>
      <div class="seg" role="group">
        <button type="button" id="seg-ev" data-seg="agenda" aria-pressed="true" data-i18n="seg_events"></button>
        <button type="button" id="seg-fe" data-seg="fetes" aria-pressed="false" data-i18n="seg_fetes"></button>
      </div>
      <div id="pane-events" class="list" style="gap:18px"></div>
      <div id="pane-fetes" class="list" style="gap:10px" hidden></div>
    </section>

    <!-- GALERIE -->
    <section class="view" id="v-galerie" data-view="galerie">
      <div class="eyebrow" data-i18n="gal_eyebrow"></div>
      <h2 data-i18n="gal_title"></h2>
      <div id="gallery"></div>
    </section>

    <!-- LE CERCLE -->
    <section class="view" id="v-cercle" data-view="cercle">
      <div class="eyebrow" data-i18n="org_eyebrow"></div>
      <h2 data-i18n="about_title"></h2>
      <p class="lead" data-i18n="about_lead"></p>
      <h2 data-i18n="branches_title"></h2>
      <div class="list">
        <div class="item"><div class="swatch" style="background:var(--kente-g)"></div><div><h3 data-i18n="br1_t"></h3><p data-i18n="br1_d"></p><span class="pill ok" data-i18n="active"></span></div></div>

      <h2 data-i18n="comm_title"></h2>
      <div class="list">
        <div class="item"><div class="swatch" style="background:var(--gold)"></div><div><h3 data-i18n="c1_t"></h3><p data-i18n="c1_d"></p></div></div>
        <div class="item"><div class="swatch" style="background:var(--kente-r)"></div><div><h3 data-i18n="c2_t"></h3><p data-i18n="c2_d"></p></div></div>
        <div class="item"><div class="swatch" style="background:var(--kente-g)"></div><div><h3 data-i18n="c3_t"></h3><p data-i18n="c3_d"></p></div></div>
        <div class="item"><div class="swatch" style="background:var(--gold-soft)"></div><div><h3 data-i18n="c4_t"></h3><p data-i18n="c4_d"></p></div></div>

        <a class="contact" href="https://t.me/CercleDesAfricains" target="_blank" rel="noopener"><b>Telegram</b><span>@CercleDesAfricains</span></a>
        <a class="contact" href="https://youtube.com/@cercledesafricains" target="_blank" rel="noopener"><b>YouTube</b><span>@cercledesafricains</span></a>
        <div class="contact"><b data-i18n="email"></b><span>contact@cercledesafricains.ru</span></div>
        <a class="contact" href="https://cercledesafricains.org" target="_blank" rel="noopener"><b data-i18n="site"></b><span>cercledesafricains.org</span></a>
        <div class="contact"><b data-i18n="addr"></b><span data-i18n="addr_v"></span></div>
      </div>
      <div class="item"><div><h3 data-i18n="pres"></h3><p>Hervé Antoine Gbilimou</p></div></div>

      <h2 data-i18n="share_title"></h2>
      <div class="share">
        <img src="qr.png" alt="QR code de l'application" width="128" height="128">
        <div>

          <button type="button" class="cta small" id="copy-link" data-i18n="share_copy"></button>

      <div class="item"><div><h3>iPhone (Safari)</h3><ol class="steps" style="margin-top:8px"><li data-i18n="ios1"></li><li data-i18n="ios2"></li><li data-i18n="ios3"></li></ol></div></div>

    <!-- ADHÉRER -->

  </main>

  <nav class="tabs" aria-label="Navigation">
    <div class="in">

const APP_URL = "https://herveantoinegbilimou1-web.github.io/cercle-app/";
const T = {
  fr: {

const LOCALE = {fr:"fr-FR", ru:"ru-RU", en:"en-GB"};
let lang = "fr";
try { const s = localStorage.getItem("cda_lang"); if (T[s]) lang = s; } catch(e) {}

/* ---------- Lecture de contenu.txt ---------- */
let DATA = {events:[], photos:[], fetes:[]};
function norm(k){ return k.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").trim(); }
function parseContent(txt){
  const out = {events:[], photos:[], fetes:[]};
  let section = "", cur = null;
  const flush = () => { if (cur && cur.date && cur.titre) out.events.push(cur); cur = null; };
  for (const raw of txt.split(/\r?\n/)) {
    const line = raw.trim();
    if (line.startsWith("#")) continue;
    const sec = line.match(/^\[(.+)\]$/);
    if (sec) { flush(); section = norm(sec[1]); continue; }
    if (!line) { if (section.startsWith("evenement")) flush(); continue; }
    if (section.startsWith("evenement")) {
      const i = line.indexOf(":"); if (i < 1) continue;
      const k = norm(line.slice(0,i)), v = line.slice(i+1).trim();
      if (k === "date" && cur && cur.date) flush();
      cur = cur || {}; cur[k] = v;
    } else if (section.startsWith("galerie")) {
      const p = line.split("|").map(s => s.trim());
      if (p[0]) out.photos.push({src:p[0], fr:p[1]||"", ru:p[2]||"", en:p[3]||""});
    } else if (section.startsWith("fete")) {
      const p = line.split("|").map(s => s.trim());
      const dm = (p[1]||"").match(/^(\d{1,2})\/(\d{1,2})$/);
      if (p.length >= 5 && dm) out.fetes.push({code:p[0].toUpperCase(), d:+dm[1], m:+dm[2], year:+p[2]||0,
        type:norm(p[3]||"").startsWith("indep") ? "independance" : "nationale", fr:p[4], ru:p[5]||p[4], en:p[6]||p[4]});
    }
  }
  flush();
  return out;
}
function loc(o, key){ return o[key + "_" + lang] || o[key] || ""; }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function flag(code){ return /^[A-Z]{2}$/.test(code) ? String.fromCodePoint(...[...code].map(c => 0x1F1E6 + c.charCodeAt(0) - 65)) : "🌍"; }
function today0(){ const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
function parseDate(s){ const m = (s||"").match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; }
function ordinal(n){
  if (lang === "fr") return n === 1 ? "1er" : n + "e";
  if (lang === "ru") return n + "-я";
  const s = ["th","st","nd","rd"], v = n % 100; return n + (s[(v-20)%10] || s[v] || s[0]);
}
function anniv(n){ return lang === "fr" ? ordinal(n) + " anniversaire" : lang === "ru" ? ordinal(n) + " годовщина" : ordinal(n) + " anniversary"; }
function daysLabel(n){ return n === 0 ? T[lang].today : n === 1 ? T[lang].tomorrow : T[lang].in_days.replace("{n}", n); }
function nextFetes(){
  const t = today0();
  return DATA.fetes.map(f => {
    let d = new Date(t.getFullYear(), f.m-1, f.d);
    if (d < t) d = new Date(t.getFullYear()+1, f.m-1, f.d);
    return {...f, next:d, days:Math.round((d - t)/864e5), age:d.getFullYear() - f.year};
  }).sort((a,b) => a.days - b.days);
}

/* ---------- Affichage ---------- */
function renderEvents(){
  const L = T[lang], t = today0(), fmtM = new Intl.DateTimeFormat(LOCALE[lang], {month:"short"});
  const evs = DATA.events.map(e => ({...e, dt:parseDate(e.date)})).filter(e => e.dt);
  const up = evs.filter(e => e.dt >= t).sort((a,b) => a.dt - b.dt);
  const past = evs.filter(e => e.dt < t).sort((a,b) => b.dt - a.dt);
  const card = (e, isPast) => {
    const cat = L["cat_" + norm(e.categorie || "")] || "";
    const meta = [e.heure && "🕒 " + esc(e.heure), e.lieu && "📍 " + esc(e.lieu)].filter(Boolean).join("</span><span>");
    return `<div class="item"><div class="date"><b>${e.dt.getDate()}</b><small>${fmtM.format(e.dt)}</small><small>${e.dt.getFullYear()}</small></div>
      <div>${cat ? `<span class="tag">${esc(cat)}</span>` : ""}<h3>${esc(loc(e,"titre"))}</h3>
      ${loc(e,"texte") ? `<p>${esc(loc(e,"texte"))}</p>` : ""}
      ${meta && !isPast ? `<div class="meta"><span>${meta}</span></div>` : ""}
      ${!isPast && /^https?:\/\//.test(e.lien||"") ? `<a class="cta small" href="${esc(e.lien)}" target="_blank" rel="noopener">${esc(L.more)}</a>` : ""}
      ${isPast ? `<span class="pill past">${esc(L.past)}</span>` : `<span class="pill ok">${esc(daysLabel(Math.round((e.dt - t)/864e5)))}</span>`}</div></div>`;
  };
  document.getElementById("pane-events").innerHTML =
    `<div class="list"><h2>${esc(L.upcoming)}</h2>${up.length ? up.map(e => card(e,false)).join("") : `<div class="empty">${esc(L.agenda_empty)} <a href="https://t.me/CercleDesAfricains" target="_blank" rel="noopener">Telegram</a></div>`}</div>` +
    (past.length ? `<div class="list"><h2>${esc(L.past_title)}</h2>${past.map(e => card(e,true)).join("")}</div>` : "");
  // Accueil : prochain événement
  const se = document.getElementById("spot-event");
  se.innerHTML = up.length
    ? `<span class="k">${esc(L.spot_event)}</span><b>${esc(loc(up[0],"titre"))}</b><small>${new Intl.DateTimeFormat(LOCALE[lang],{day:"numeric",month:"long"}).format(up[0].dt)}${up[0].lieu ? " · " + esc(up[0].lieu) : ""}</small>`
    : `<span class="k">${esc(L.spot_event)}</span><b>${esc(L.spot_noevent)}</b><small>${esc(L.spot_noevent_d)}</small>`;
}
function renderFetes(){
  const L = T[lang], list = nextFetes(), fmt = new Intl.DateTimeFormat(LOCALE[lang], {day:"numeric", month:"long"});
  const fmtMonth = new Intl.DateTimeFormat(LOCALE[lang], {month:"long"});
  const sf = document.getElementById("spot-fete");
  if (list.length) {
    const f = list[0];
    sf.innerHTML = `<span class="k">${esc(L.spot_fete)}</span><span class="flag">${flag(f.code)}</span><b>${esc(f[lang])}</b><small>${fmt.format(f.next)} · ${esc(anniv(f.age))}</small><span class="count">${esc(daysLabel(f.days))}</span>`;
  } else sf.innerHTML = `<span class="k">${esc(L.spot_fete)}</span><b>—</b>`;
  let html = `<p class="note">${esc(L.fetes_intro)}</p>`, lastM = "";
  for (const f of list) {
    const m = fmtMonth.format(f.next) + " " + f.next.getFullYear();
    if (m !== lastM) { html += `<div class="month">${esc(m)}</div>`; lastM = m; }
    html += `<div class="item fete${f.days === 0 ? " today" : ""}"><div class="flag">${flag(f.code)}<small style="font-family:var(--body)">${String(f.d).padStart(2,"0")}.${String(f.m).padStart(2,"0")}</small></div>
      <div><h3>${esc(f[lang])}</h3><p>${esc(L["type_" + f.type])} · ${esc(anniv(f.age))}</p>
      <span class="pill ${f.days <= 7 ? "wip" : "past"}">${esc(daysLabel(f.days))}</span></div></div>`;
  }
  document.getElementById("pane-fetes").innerHTML = html;
}
function renderGallery(){
  const L = T[lang], g = document.getElementById("gallery");
  if (!DATA.photos.length) { g.innerHTML = `<div class="empty">${esc(L.gal_empty)}</div>`; return; }
  g.innerHTML = `<div class="gallery">${DATA.photos.map((p,i) => `<button type="button" data-i="${i}"><img src="${esc(p.src)}" alt="${esc(p[lang]||p.fr)}" loading="lazy">${(p[lang]||p.fr) ? `<span>${esc(p[lang]||p.fr)}</span>` : ""}</button>`).join("")}</div>`;
  g.querySelectorAll("button[data-i]").forEach(b => b.addEventListener("click", () => {
    const p = DATA.photos[+b.dataset.i];
    document.getElementById("lb-img").src = p.src;
    document.getElementById("lb-img").alt = p[lang] || p.fr;
    document.getElementById("lb-cap").textContent = p[lang] || p.fr;
    document.getElementById("lightbox").classList.add("on");
  }));
}
function applyLang(){
  const d = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = d[el.dataset.i18n] ?? ""; });
  document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = d[el.dataset.i18nHtml] ?? ""; });
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  renderEvents(); renderFetes(); renderGallery();
}
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang; try { localStorage.setItem("cda_lang", lang); } catch(e) {} applyLang();
}));
document.getElementById("lb-close").addEventListener("click", () => document.getElementById("lightbox").classList.remove("on"));
document.getElementById("lightbox").addEventListener("click", e => { if (e.target.id === "lightbox") e.currentTarget.classList.remove("on"); });
document.getElementById("copy-link").addEventListener("click", async () => {
  const out = document.getElementById("copied");
  try { await navigator.clipboard.writeText(APP_URL); out.textContent = T[lang].copied; }
  catch(e) { out.textContent = T[lang].copy_fail + APP_URL; }
});

/* ---------- Navigation ---------- */
const VIEWS = ["accueil","agenda","galerie","cercle","adherer"];
function route(){
  let h = (location.hash || "").replace("#","");
  let pane = "agenda";
  if (h === "fetes") { pane = "fetes"; h = "agenda"; }
  const anchor = h === "contact" ? "contact" : null;
  if (anchor) h = "cercle";
  const v = VIEWS.includes(h) ? h : "accueil";
  document.querySelectorAll("section.view").forEach(s => s.classList.toggle("on", s.dataset.view === v));
  document.querySelectorAll("nav.tabs a").forEach(a => { if (a.dataset.tab === v) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  if (v === "agenda") {
    document.getElementById("pane-events").hidden = pane !== "agenda";
    document.getElementById("pane-fetes").hidden = pane !== "fetes";
    document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.seg === pane));
  }
  if (anchor) document.getElementById(anchor).scrollIntoView(); else window.scrollTo(0,0);
}
document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => { location.hash = b.dataset.seg; }));
window.addEventListener("hashchange", route);

applyLang(); route();
fetch("contenu.txt", {cache:"no-cache"}).then(r => r.ok ? r.text() : Promise.reject()).then(txt => { DATA = parseContent(txt); applyLang(); route(); }).catch(() => {});
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
